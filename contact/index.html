<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Hill Country Web Works</title>
    <meta
      name="description"
      content="Contact Hill Country Web Works to start a website project, discuss IT support, or book a consultation."
    />
    <meta name="theme-color" content="#7A1E2C" />
    <meta property="og:title" content="Contact | Hill Country Web Works" />
    <meta
      property="og:description"
      content="Contact Hill Country Web Works to start a website project, discuss IT support, or book a consultation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hcww.net/contact/" />
    <link rel="canonical" href="https://hcww.net/contact/" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/assets/js/site-shell.js" defer></script>
  </head>
  <body data-page="contact">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div data-site-header></div>
    <main id="main-content" class="section">
      <div class="shell stack">
        <div class="page-intro">
          <p class="eyebrow">Contact</p>
          <h1>Start with a simple conversation.</h1>
          <p class="lead">
            Tell us what you need help with and we can map out the next best step together.
          </p>
        </div>
        <div class="split">
          <div class="card">
            <h2>Contact details</h2>
            <p>Phone: (830) 431-0005</p>
            <p>Email: robert@hcww.net</p>
            <p>Hours: Standard business hours with emergency support available.</p>
          </div>
          <form class="card form" aria-label="Contact form">
            <label>
              Name
              <input type="text" name="name" />
            </label>
            <label>
              Email
              <input type="email" name="email" />
            </label>
            <label>
              How can we help?
              <textarea name="message" rows="5"></textarea>
            </label>
            <button class="button button--primary" type="button">Send Inquiry</button>
          </form>
        </div>
      </div>
    </main>
    <div data-site-footer></div>
  </body>
</html>
